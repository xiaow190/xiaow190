<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
  <title id="title">GUOWEI · 机器人、仿真与工具开发</title>
  <desc id="desc">黑色背景、电光青与蓝紫色线路，搭配终端风格文字、机械臂和线框球体。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03070e"/><stop offset="1" stop-color="#0b1324"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#33f5d2"/><stop offset=".52" stop-color="#42caff"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#147ca7" stop-opacity=".3"/><stop offset="1" stop-color="#147ca7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5da8d8" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .cursor { animation: blink 1.2s steps(1) infinite; }
    .signal { stroke-dasharray: 5 13; animation: flow 4s linear infinite; }
    .halo { animation: pulse 4s ease-in-out infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -72; } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .signal, .halo { animation: none; } }
  </style>
