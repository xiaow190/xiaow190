  <rect width="1040" height="320" rx="10" fill="url(#grid)"/>
  <ellipse cx="824" cy="158" rx="210" ry="164" fill="url(#aura)"/>
  <rect x=".5" y=".5" width="1039" height="319" rx="10" fill="none" stroke="#24354a"/>
  <g fill="none" stroke="#41e9dc" stroke-width="2"><path d="M1 37V10Q1 1 10 1H37 M1003 1H1030Q1039 1 1039 10V37 M1 283V310Q1 319 10 319H37 M1003 319H1030Q1039 319 1039 310V283"/></g>
